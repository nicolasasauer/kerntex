[package]
name = "kerntex-mcp"
version = "0.1.7"
description = "Connects AI agents (MCP clients) to the running KernTeX app"
authors = ["Nicolas Sauer"]
license = "MIT"
repository = "https://github.com/nicolasasauer/kerntex"
edition = "2021"
rust-version = "1.92"

[lib]
name = "kerntex_mcp"

[[bin]]
name = "kerntex-mcp"
path = "src/main.rs"

[dependencies]
interprocess = "2.4"
