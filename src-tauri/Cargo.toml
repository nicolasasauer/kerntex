[workspace]
members = ["mcp-proxy"]

[package]
name = "kerntex"
version = "0.1.7"
description = "A fast, modern, local LaTeX editor"
authors = ["Nicolas Sauer"]
license = "MIT"
repository = "https://github.com/nicolasasauer/kerntex"
edition = "2021"
rust-version = "1.92"

[lib]
name = "kerntex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
trash = "5"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-files", "system-downloader", "datetime"] }
typst-layout = "0.15.1"
rmcp = { version = "3.11", default-features = false, features = ["server", "macros"] }
tokio-util = "0.7"
kerntex-mcp = { path = "mcp-proxy" }
interprocess = { version = "2.4", features = ["tokio"] }
schemars = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "sync", "time"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
rmcp = { version = "3.11", default-features = false, features = ["client", "server", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
