[package]
name = "kerntex"
version = "0.1.3"
description = "A fast, modern, local LaTeX editor"
authors = ["Nicolas Sauer"]
license = "MIT"
repository = "https://github.com/nicolasasauer/kerntex"
edition = "2021"
rust-version = "1.80"

[lib]
name = "kerntex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
trash = "5"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-files", "system-downloader", "datetime"] }
typst-layout = "0.15.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
