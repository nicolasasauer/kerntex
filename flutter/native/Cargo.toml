[package]
name = "kerntex-native"
version = "0.1.3"
description = "C ABI over the KernTeX core for the Flutter UI"
authors = ["Nicolas Sauer"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "kerntex_native"
# rlib: lets examples (the rendering corpus) use the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
trash = "5"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-files", "system-downloader", "datetime"] }
typst-layout = "0.15.1"
hayro = "0.7"
dirs = "7"
opener = "0.9"

[dev-dependencies]
# Already in the tree via hayro; used by the corpus example for diff images.
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Quick local builds: `hooks: user_defines: kerntex: cargo_profile: fast` in pubspec.yaml.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
