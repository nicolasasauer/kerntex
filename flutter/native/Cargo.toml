[package]
name = "kerntex-native"
version = "0.1.3"
description = "C ABI over the KernTeX core for the Flutter UI"
authors = ["Nicolas Sauer"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "kerntex_native"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
trash = "5"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-files", "system-downloader", "datetime"] }
typst-layout = "0.15.1"
hayro = "0.7"
dirs = "7"
opener = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
