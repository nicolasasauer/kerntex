name: Release

# Push a tag like v0.1.0 to build installers and create a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # NSIS .exe + .msi
          - os: ubuntu-22.04 # .AppImage + .deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Bundle Tectonic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run setup:tectonic

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: KernTeX ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your system below. Tectonic is included — no TeX installation needed.

            **Windows:** `KernTeX_*_x64-setup.exe` (or the `.msi`). SmartScreen may warn because the installer isn't code-signed yet: click “More info” → “Run anyway”.
            **Linux:** `.AppImage` (make it executable, then run) or `.deb`.
          releaseDraft: true
          args: --config src-tauri/tauri.tectonic.conf.json

      - name: MSIX package for the Microsoft Store
        id: msix
        if: runner.os == 'Windows'
        env:
          # From Partner Center → Product identity (Settings → Secrets and variables → Actions → Variables).
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: node scripts/build-msix.mjs --profile release

      - name: Keep the MSIX as a workflow artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: KernTeX-msix
          path: ${{ steps.msix.outputs.msix }}

      - name: Attach the MSIX to the release
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.msix.outputs.msix }}" --clobber

      - name: Installer sizes
        shell: bash
        run: find src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.msix' \) -exec ls -lh {} \; | tee -a "$GITHUB_STEP_SUMMARY"
