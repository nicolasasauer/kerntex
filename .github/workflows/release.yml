name: Release

# Push a tag like v0.1.0 to build installers and create a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # NSIS .exe + .msi
          - os: ubuntu-22.04 # .AppImage + .deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Bundle Tectonic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run setup:tectonic

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: KernTeX ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your system below. Tectonic is included — no TeX installation needed.

            **Windows:** `KernTeX_*_x64-setup.exe` (or the `.msi`). SmartScreen may warn because the installer isn't code-signed yet: click “More info” → “Run anyway”.
            **Linux:** `.AppImage` (make it executable, then run) or `.deb`.
          releaseDraft: true
          args: --config src-tauri/tauri.tectonic.conf.json

      - name: Installer sizes
        shell: bash
        run: find src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) -exec ls -lh {} \; | tee -a "$GITHUB_STEP_SUMMARY"
