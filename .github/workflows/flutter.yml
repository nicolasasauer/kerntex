name: Flutter UI

# The Flutter front end (flutter/) on the shared Rust core. Builds Linux and
# Windows bundles — with the Tectonic sidecar next to the executable — and
# uploads them as workflow artifacts to try out.

on:
  push:
    branches: [main, flutter-ui]
    paths: ["flutter/**", "src-tauri/src/core/**", "src-tauri/templates/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["flutter/**", "src-tauri/src/core/**", "src-tauri/templates/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            bundle: flutter/build/linux/x64/release/bundle
          - os: windows-latest
            target: windows
            bundle: flutter/build/windows/x64/runner/Release
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      # The build hook honours this, so `flutter build` reuses the cached Rust build.
      CARGO_TARGET_DIR: ${{ github.workspace }}/flutter/native/target
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flutter/native

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust bridge — fmt, clippy, FFI test
        working-directory: flutter/native
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test -- --exact tests::typst_project_compiles_and_renders --nocapture

      - name: Dart — format, analyze, test
        working-directory: flutter
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib hook test
          flutter analyze
          flutter test

      - name: Build
        working-directory: flutter
        run: flutter build ${{ matrix.target }} --release

      - name: Bundle Tectonic
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-tectonic.mjs
          bin=$(ls src-tauri/binaries/tectonic-* | head -n1)
          ext=""; [[ "$bin" == *.exe ]] && ext=".exe"
          cp "$bin" "${{ matrix.bundle }}/tectonic$ext"

      - uses: actions/upload-artifact@v4
        with:
          name: kerntex-flutter-${{ matrix.target }}
          path: ${{ matrix.bundle }}
          retention-days: 14
