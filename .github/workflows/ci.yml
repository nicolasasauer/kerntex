name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev \
            latexmk texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-bibtex-extra texlive-fonts-recommended

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:scripts

      - name: Fetch Tectonic (for the end-to-end test)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run setup:tectonic
          bin=$(ls "$PWD"/src-tauri/binaries/tectonic-* | head -n1)
          if command -v cygpath > /dev/null; then bin=$(cygpath -w "$bin"); fi
          echo "KERNTEX_TECTONIC=$bin" >> "$GITHUB_ENV"

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test -- --nocapture

      - name: MSIX package builds (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml
          node scripts/build-msix.mjs --profile debug
